apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kvname-week3
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "eff2a750-0a68-4c7c-9d33-943b67545d83"
    keyvaultName: "kv-bootcamp-week3"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: azure-openai-endpoint
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: azure-openai-deployment
          objectType: secret
    tenantId: "95912afd-4771-4072-a56b-8ef84e015310"
  # This block is what actually turns the fetched secrets into
  # Kubernetes Secret data, which we can then expose as env vars
  # on the pod (see deployment.yaml). Without this, the CSI driver
  # only mounts secrets as files in the pod's filesystem — it does
  # NOT create env vars by itself.
  secretObjects:
    - secretName: azure-openai-secrets
      type: Opaque
      data:
        - objectName: azure-openai-endpoint
          key: AZURE_OPENAI_ENDPOINT
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: azure-openai-deployment
          key: AZURE_OPENAI_DEPLOYMENT