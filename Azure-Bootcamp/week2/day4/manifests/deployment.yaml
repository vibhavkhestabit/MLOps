apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
            containers:
            - name: flask-app
              image: vibhavacrday4.azurecr.io/flask-app:latest
              ports:
              - containerPort: 5000
              readinessProbe:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 3
                periodSeconds: 5
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /
                  port: 5000
                initialDelaySeconds: 10
                periodSeconds: 10