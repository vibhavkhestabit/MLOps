# --- Backend API upstream (BLUE - Active) ---
upstream app_blue {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3004 max_fails=3 fail_timeout=30s;
}

# --- Backend API upstream (GREEN - Inactive) ---
upstream app_green {
    least_conn;
    server 127.0.0.1:3010 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3013 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:3014 max_fails=3 fail_timeout=30s;
}

# --- Frontend upstream (Unchanged) ---
upstream nextjs_frontend {
    server 127.0.0.1:3001 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name stack1.devops.local;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stack1.devops.local;

    ssl_certificate /etc/ssl/certs/stack1.crt;
    ssl_certificate_key /etc/ssl/private/stack1.key;

    # Frontend Route
    location / {
        proxy_pass http://nextjs_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # API Route (Configured for Blue/Green)
    location /api/ {
        # The zero_downtime script will toggle this line between app_blue and app_green
        proxy_pass http://app_blue;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
