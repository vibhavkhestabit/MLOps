# Stack 3: FastAPI Backend Pool
upstream fastapi_backend {
    least_conn;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8004 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:8005 max_fails=3 fail_timeout=30s;
}

# Stack 3: Next.js Frontend Pool
upstream stack3_frontend {
    server 127.0.0.1:3005 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:3006 max_fails=2 fail_timeout=30s;
}

server {
    listen 80;
    server_name stack3.devops.local;

    # Route UI traffic to Next.js
    location / {
        proxy_pass http://stack3_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route API traffic to FastAPI
    location /api/ {
        # Optional: Add basic API response caching
        # proxy_cache my_cache;
        # proxy_cache_valid 200 1m;
        
        proxy_pass http://fastapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}