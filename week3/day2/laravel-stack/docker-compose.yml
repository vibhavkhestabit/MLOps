services:
  app:
    build: ./laravel
    container_name: laravel_app

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    environment:
      APP_ENV: local

    volumes:
      - ./laravel:/var/www

    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "8070:80"

    volumes:
      - ./laravel:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql

    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: laravel_redis

    ports:
      - "6371:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build: ./laravel
    container_name: laravel_queue

    command: sh -c "php artisan config:clear && php artisan queue:work"

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./laravel:/var/www

volumes:
  mysql_data: