services:
  backend:
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    # Override the built nginx image with a raw node runner for Vite HMR
    image: node:20-alpine
    build: !reset null          # cancel the base build — use the image above
    ports:
      - "5173:5173"
      - "8095:80"               # keep base port too, or remove if not needed in dev
    working_dir: /app
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"