upstream backend {
    # Docker Compose automatically load-balances traffic across 
    # all scaled container replicas under this service name
    server backend:5000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;

    # Route default web traffic to your frontend container pool
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route API traffic to your scaled backend cluster
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nginx structural health probe
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}