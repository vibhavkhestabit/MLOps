apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:

      initContainers:
      - name: init-web-content
        image: busybox

        command:
        - sh
        - -c
        - |
          echo "<h1>Welcome to Kubernetes Deployment</h1>" > /data/index.html
          echo "<p>Generated by Init Container</p>" >> /data/index.html

        volumeMounts:
        - name: web-content
          mountPath: /data

      containers:
      - name: nginx
        image: nginx:1.25-alpine

        ports:
        - containerPort: 80

        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html

      volumes:
      - name: web-content
        emptyDir: {}