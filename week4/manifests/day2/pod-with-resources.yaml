apiVersion: v1
kind: Pod

metadata:
  name: nginx-limited
  labels:
    app: nginx
    tier: frontend

spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine

      ports:
        - containerPort: 80
          name: http

      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"

        limits:
          memory: "128Mi"
          cpu: "200m"