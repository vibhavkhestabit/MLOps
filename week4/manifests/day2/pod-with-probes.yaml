apiVersion: v1
kind: Pod

metadata:
  name: nginx-probes
  labels:
    app: nginx

spec:
  containers:
    - name: nginx
      image: nginx:1.25-alpine

      ports:
        - containerPort: 80

      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"

        limits:
          memory: "128Mi"
          cpu: "200m"

      livenessProbe:
        httpGet:
          path: /
          port: 80

        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /
          port: 80

        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 2